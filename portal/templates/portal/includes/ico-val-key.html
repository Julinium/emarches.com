
<div class="d-flex">
    <div class="{{ kac }}">
        <i class="fs-6 bi bi-{{ ico }}"></i>
    </div>
    <div class="ms-2 w-100">
        <div class="{{ kac }} pb-1 border-bottom">
            <span>{{ key }}</span>
        </div>
        <div class="pt-1">
            {% if template %}
                {% include template %}
            {% else %}
                {% if scope == 'auth' and not request.user.is_authenticated %}
                    {% include 'portal/includes/login-button.html' %}
                {% else %}
                    <span class="{{ vac }}">{{ val }}</span>
                    {% if vex %}<span class="ms-1">{{ vex }}</span>{% endif %}
                {% endif %}
            {% endif %}
        </div>
    </div>
</div>
