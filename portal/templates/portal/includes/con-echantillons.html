{% load taginos %}

{% if request.user.is_authenticated %}
    <ul class="list-group mb-3 shadow-sm">  
        {% for ech in con.lot_set.first.echantillons %}
            <li class="px-2 list-group-item"><span class="fw-bold">{{ ech.Date|parse_iso_date }}</span> {{ ech.Lieu }}</li>
        {% endfor %}
    </ul>
{% else %}
    <div class="d-block">
        {% include 'portal/includes/login-button.html' %}
    </div>
{% endif %}
