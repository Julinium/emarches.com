{% load taginos %}

{% if request.user.is_authenticated %}
    <ul class="list-unstyled mb-3 p-0">  
        {% for ech in con.lot_set.first.echantillons %}
            <li class="mt-1">— <span class="fw-bold">{{ ech.Date|parse_iso_date }}</span> - {{ ech.Lieu }}</li>
        {% endfor %}
    </ul>
{% else %}
    <div class="d-block">
        {% include 'portal/includes/login-button.html' %}
    </div>
{% endif %}
