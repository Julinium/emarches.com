{% if request.user.is_authenticated %}
    <ul class="list-unstyled mb-3 p-0">  
        {% for q in con.lot_set.first.qualifications.all %}
            <li class="mt-1">
                <div class="d-flex">
                    <span>—</span>
                    <div class="ms-1">
                        <div>
                            <button class="btn btn-sm btn-secondary py-0 px-1" type="button" data-bs-toggle="collapse" data-bs-target="#qualif-{{ forloop.counter }}" aria-expanded="false" aria-controls="qualif-{{ forloop.counter }}">
                                <span>{{ q.qualification.label }}</span>
                                <span class="ms-1"><i class="bi bi-chevron-compact-down"></i></span>
                            </button>
                        </div>
                        <div class="collapse mb-2" id="qualif-{{ forloop.counter }}">
                            <span class="">{{ q.qualification }}</span>
                        </div>
                    </div>
                </div>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <div class="d-block">
        {% include 'portal/includes/login-button.html' %}
    </div>
{% endif %}
